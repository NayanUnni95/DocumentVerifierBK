{% extends 'web/base.html' %}

{% block title %}Home - Document Verifier{% endblock %}

{% block content %}
<div class="hero">
    <h1>Welcome to Document Verifier</h1>
    <p>Securely verify your documents using blockchain technology.</p>
    {% if not user.is_authenticated %}
    <a href="{% url 'account_signup' %}" class="btn">Get Started</a>
    {% else %}
    <a href="{% url 'dashboard' %}" class="btn">Go to Dashboard</a>
    {% endif %}
</div>
{% endblock %}
